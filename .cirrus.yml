container:
  image: ghcr.io/cirruslabs/flutter:latest

test_task:
  pub_cache:
    folder: ~/.pub-cache
    populate_script:
      - flutter pub get > update_report.txt
  test_script:
    - flutter test --machine > flutter_report.json
  always:
    report_artifacts:
      path: flutter_report.json
      format: flutter
